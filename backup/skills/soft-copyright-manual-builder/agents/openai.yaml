interface:
  display_name: "软著操作手册与垂直系统一体化生成"
  short_description: "合并 vertical-image-system-builder 与 software-copyright-deliverables：一站式完成垂直系统生成、真实运行验收、研发留痕、状态链多态截图、软著三件套 Word 交付（默认不产出 PDF）"
  default_prompt: "使用「软著操作手册与垂直系统一体化生成」技能（$soft-copyright-manual-builder）为【软件全称】在 Codex（Windows + PowerShell）内完成整条链路：先做名称编译、三案竞争、frontend-design 视觉精修、独立登录页、全页异构矩阵、源码原创指纹、反换词独立开发检查、工业诊断台级功能复杂度与跨项目防重复；再按 threejs-* 技能包实现工业现场级复杂真实数字孪生三维（分区≥2/设备族≥3/部件≥24/几何≥48/材质≥6/层级≥4/路径≥1）与真实业务闭环。真实案例图默认必须为中国境内场景：下载并本地化至少6张，台账记录 country: 中国、省市地点、地点依据、来源和许可；除非用户明确指定外国地点，否则禁止下载、保留、引用或交付外国图片。完成构建、行为、三维、功能复杂度抽查、反换词源码对照、素材校验脚本、页面缩略拼图和三轮验收，并产出设计说明.md、验收记录.md、操作手册.md、研发留痕/（研发留痕/研发流程文档收进 [软件全称]-源代码/ 内，不单独占用交付根目录）。然后进入软著交付：生成17项申请表（11–14项本项目独立重写）、以本项目后端/API、领域服务、规则引擎、状态机、数据处理算法、模型/仓储/持久化等真实源码为主体、前半部分绝大多数为后端/算法代码且剔除前端样式代码与页面结构代码、后端与算法逻辑源码占比≥85%的代码文档（Word/WPS实测约70页，以代码为主、尽量减少不必要的中文注释）；再生成51–60页、第1页纯文字首页、正文无文档制作说明/元叙述、无旧案换词、无AI腔/无重复句段灌水、含开发留痕（版本/PR/提交/日志摘要）的操作手册。操作手册截图必须遵循状态链多态协议：每张截图都是真实操作后的新状态，状态链由本项目真实业务流程编译（示例：空白页→输入密码→评估出结果→导出弹窗→删除后列表变化，仅示意禁止照抄），同组至少1张含弹框/抽屉/详情面板，结果态至少两个业务区域变化；每张截图配3–5行短人话说明，讲清“执行哪一步操作后得到此页”和“页面主要元素用途”，禁止长篇大论；操作步骤与截图严格一一对应，禁止无截图的长步骤清单。截图统一按 viewport 1440×900、deviceScaleFactor: 2（约2880×1800）采集并做100%清晰度复核，正文实际嵌入独立截图≥30张。代码 Word 和操作手册 Word 定稿后按 Word/WPS 实测页数并复核首尾页即可；最终交付默认只保留 DOCX、不产出 PDF。仅当用户明确要求 PDF 时才用 WPS 直接输出且不放入交付根目录；禁止其他转换器。执行去AI味与换行业/同级换词/公开通用句三项检查。至少循环3轮完成 Word/WPS、截图唯一性、逐页一致性、独创性/代表性、去AI味、后端算法占比、目录清洁验收（默认不产出 PDF），未全绿不得交付；最后执行根目录收敛，项目根只留申请表/代码docx/操作手册docx/[软件全称]-源代码（默认无 PDF），移走或删除 node_modules、dist、开发残留、生成期代码.txt、临时“-新”手册名。硬门禁之外全部是变量层：技术栈、页面数量、模块结构、源代码文件格式、手册章节语法、截图状态链、研发留痕文件结构每案必须重新编译，禁止连续两案同构；源代码允许不同语言、不同目录结构、不同文件命名、不同模块组织，只要真实可运行、后端/算法逻辑有效源码占比≥85%、能通过反换词对照即可。真实开发优先：禁止虚拟图、生图、无关内容与跑不通流程；代码文档以代码为主、尽量减少不必要的中文注释（只保留少量必要注释），Python 等禁止同构模板凑页，可单独生成不参与运行的算法说明并标注。"
