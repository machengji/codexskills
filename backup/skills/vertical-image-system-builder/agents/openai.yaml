interface:
  display_name: "垂直影像全栈系统生成"
  short_description: "按软件全称落地可运行的中文垂直全栈系统与工业数字孪生"
  default_prompt: "使用「垂直影像全栈系统生成」技能（$vertical-image-system-builder）为【系统全称】在 ZCode 内完成名称驱动的垂直业务前端系统。先完成三案竞争、frontend-design 视觉精修、独立登录页、十五页异构矩阵、源码原创指纹、反换词独立开发检查、工业诊断台级功能复杂度（每页≥16操作/≥5专属/≥3并发工作区，全站≥5高密度诊断台页）和跨项目防重复；禁止复制旧项目后批量替换关键词。再按 threejs-complete-set-of-skill 路由实现工业现场级复杂真实数字孪生三维（整厂/产线/仓储，含分区、路径、多设备族与 HUD）与真实业务闭环，确保后续软著鉴别材料具备独创性与代表性。真实案例图默认必须为中国境内场景：下载并本地化至少6张，台账记录 country: 中国、省市地点、地点依据、来源和许可；除非用户明确指定外国地点，否则禁止下载、保留、引用或交付外国图片，中国图片不足不得用外国图补位。三维须达现场级规格（分区≥2/设备族≥3/部件≥24/几何≥48/材质≥6/层级≥4/路径≥1，对标工业数字孪生工厂/仓储/产线）并含 Three.js 技能路由表与 HUD 同源叠层；完成构建、行为、三维、功能复杂度抽查、反换词源码对照、素材校验脚本、十五页缩略拼图和三轮验收，并产出设计说明.md、验收记录.md、操作手册.md。全程以完整开发者视角推进并留痕：操作手册体现需求/设计/开发/测试/部署/文档的完整流程与版本、测试、验收、缺陷、数据字典留痕，用“需求组/研发组/测试组/部署组/文档组”等不具名角色统称，不出现具体团队名称/公司名/人名；真实开发优先：禁止虚拟图、生图、无关内容与跑不通流程，核心链路必须端到端跑通，截图必须来自当前项目实际运行画面；同一页面多张流程图必须执行真实操作并优先使用保持可见的弹框/抽屉/详情面板形成至少两个业务区域变化；截图统一按 viewport 1440×900、deviceScaleFactor: 2（约2880×1800）采集；源码注释真实且本项目专属，Python 等禁止同构模板凑数，可单独生成不参与运行的算法说明供代码文档使用。最后必须保存约 10 张主要页面截图（登录页、首页/主三维工作台和核心业务页）到项目目录，并在验收记录.md 登记。"
