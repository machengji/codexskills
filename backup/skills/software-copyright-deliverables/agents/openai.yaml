interface:
  display_name: "软著交付件生成"
  short_description: "独立生成并循环验收软著申请表、真实后端算法源码文档、操作手册及 WPS 转出的 PDF；代码大于65页且后端算法占比至少60%；最终不交付代码.txt；去AI味、反公开雷同、研发留痕和真实运行截图"
  default_prompt: "使用 $software-copyright-deliverables 为指定项目生成软著交付件：先执行文档前置门禁（普通项目核对路径/截图真实性；若来自 $vertical-image-system-builder 再额外核对设计说明、验收记录、源码原创指纹、反换词、手册去AI味与研发留痕）；再执行 R21 鉴别材料独创性门禁，禁止跨项目模板化套写和批量替换关键词。输入至少含项目路径与软件全称；开发人员/团队有则用、无则角色统称；著作权人可后补不得伪造。生成前复用或用 scripts/generate_dev_forge.py 补齐项目内类GitHub「研发留痕/」。然后生成17项申请表（11–14项本项目独立重写）、以本项目后端/API、领域服务、规则引擎、状态机、数据处理算法、模型/仓储/持久化等真实源码为主体且有效源码行数至少60%的代码文档；Word/WPS实测至少66页（大于65页）；生成期可用代码.txt做同源校验，但最终删除或移出项目根；再生成51–60页、第1页纯文字首页、正文无文档制作说明/元叙述、无旧案换词、无AI腔/无重复句段灌水、含开发留痕（版本/PR/提交/日志摘要）的操作手册。代码 Word 和操作手册 Word 定稿后必须分别用 WPS 直接输出代码 PDF 与手册 PDF，并复核页数和首尾页；禁止其他转换器。执行 R23 去AI味与换行业/同级换词/公开通用句三项检查。至少循环3轮完成 Word/WPS、截图唯一性、逐页一致性、独创性/代表性、去AI味、后端算法占比、WPS PDF 和目录清洁验收，未全绿不得交付；最后执行根目录收敛，项目根只留申请表/代码docx/代码pdf/操作手册docx/操作手册pdf/[软件全称]-源代码，移走或删除 node_modules、dist、开发残留、生成期代码.txt、临时“-新”手册名（研发留痕可进源码目录或备份）。真实开发优先：禁止虚拟图、生图、无关内容与跑不通流程；代码文档保留真实项目注释，Python 等禁止同构模板凑页，可单独生成不参与运行的算法说明并标注。不要把本技能并回垂直系统技能。"
